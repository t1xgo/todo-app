<ion-header>
  <ion-toolbar>
    <ion-title>To-Do List</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <!-- Categories -->
  <ion-card>
    <ion-card-header>
      <ion-card-title>Categorías</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      <ion-list>
        <ion-item *ngFor="let category of categories; let i = index">
          <ion-label>{{ category }}</ion-label>
          <ion-button color="tertiary" fill="clear" (click)="editCategory(i)">
            <ion-icon name="create"></ion-icon>
          </ion-button>
          <ion-button color="danger" fill="clear" (click)="deleteCategory(i)">
            <ion-icon name="trash"></ion-icon>
          </ion-button>
        </ion-item>
      </ion-list>
      <ion-item>
        <ion-input
          placeholder="Nueva categoría"
          [(ngModel)]="newCategory"
        ></ion-input>
        <ion-button expand="block" (click)="addCategory()">Agregar</ion-button>
      </ion-item>
    </ion-card-content>
  </ion-card>

  <!-- Categories filter -->
  <ion-item>
    <ion-label>Categoría:</ion-label>
    <ion-select [(ngModel)]="selectedCategory" (ionChange)="filterTasks()">
      <ion-select-option value="all">Todas</ion-select-option>
      <ion-select-option *ngFor="let category of categories" [value]="category">
        {{ category }}
      </ion-select-option>
    </ion-select>
  </ion-item>

  <!-- Task List -->
  <ion-list>
    <ion-item *ngFor="let task of filteredTasks; let i = index">
      <ion-label [class.completed]="task.completed">
        {{ task.name }} <span *ngIf="task.category">({{ task.category }})</span>
      </ion-label>
      <ion-checkbox
        slot="start"
        [(ngModel)]="task.completed"
        (ionChange)="toggleTask(task)"
      ></ion-checkbox>
      <ion-button
        slot="end"
        color="danger"
        fill="clear"
        (click)="deleteTask(i)"
      >
        <ion-icon name="trash"></ion-icon>
      </ion-button>
    </ion-item>
  </ion-list>

  <!-- Add tasks -->
  <ion-item>
    <ion-input
      placeholder="Nueva tarea"
      [(ngModel)]="newTask"
    ></ion-input>
    <ion-select [(ngModel)]="taskCategory">
      <ion-select-option value="">Sin categoría</ion-select-option>
      <ion-select-option *ngFor="let category of categories" [value]="category">
        {{ category }}
      </ion-select-option>
    </ion-select>
    <ion-button expand="block" (click)="addTask()">Agregar</ion-button>
  </ion-item>
</ion-content>
